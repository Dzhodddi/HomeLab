- name: Install base packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400 # 1 day
    name: "{{ base_packages }}"
- name: Configure periodic APT update and upgrade intervals
  ansible.builtin.copy:
    owner: root
    group: root
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
- name: Unmask services
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: false
  loop:
    - apt-daily.service
    - apt-daily-upgrade.service
- name: Ensure apt-daily timers are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    masked: false
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
